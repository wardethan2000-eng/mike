<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Document previews are made by converting to PDF with LibreOffice. When a
  font a legal document asks for is missing, the substitute's different
  widths re-wrap every line, and justified paragraphs stretch to fill - the
  preview looks mangled even though the file itself is fine.

  fontconfig already maps the Microsoft core fonts to metric-compatible
  replacements (Times New Roman -> Liberation Serif, and so on). These are
  the ones it does not cover but law firms use.
-->
<fontconfig>
  <alias binding="same">
    <family>Garamond</family>
    <accept><family>EB Garamond</family></accept>
  </alias>
  <alias binding="same">
    <family>Adobe Garamond Pro</family>
    <accept><family>EB Garamond</family></accept>
  </alias>
  <alias binding="same">
    <family>Century Schoolbook</family>
    <accept><family>C059</family></accept>
  </alias>
  <alias binding="same">
    <family>New Century Schoolbook</family>
    <accept><family>C059</family></accept>
  </alias>
  <alias binding="same">
    <family>Book Antiqua</family>
    <accept><family>P052</family></accept>
  </alias>
  <alias binding="same">
    <family>Palatino Linotype</family>
    <accept><family>P052</family></accept>
  </alias>
  <alias binding="same">
    <family>Bookman Old Style</family>
    <accept><family>URW Bookman</family></accept>
  </alias>
</fontconfig>
